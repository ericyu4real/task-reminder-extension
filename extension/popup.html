<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Task Reminder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header>
      <img src="icons/icon32.png" width="18" height="18" alt="" />
      <h1>Task Reminder</h1>
    </header>

    <section id="status" class="status">
      <div id="caption" class="caption">Working on</div>
      <div id="current-title" class="current"></div>
      <div id="queued" class="queued"></div>
    </section>

    <label class="toggle">
      <span class="toggle-text">
        <span class="toggle-title">Show widget on pages</span>
        <span id="toggle-state" class="toggle-state"></span>
      </span>
      <input id="enabled" type="checkbox" role="switch" />
      <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
    </label>

    <p id="hint" class="hint"></p>
  </main>
  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
