<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Task Reminder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <section id="current" hidden>
      <div class="caption">Working on</div>
      <div id="current-title"></div>
    </section>
    <p id="empty" class="caption">No current task</p>

    <form id="form">
      <input id="title" type="text" maxlength="200" placeholder="What are you working on?" autocomplete="off" autofocus />
      <button id="submit" type="submit">Start</button>
    </form>
    <p id="error" class="error" hidden></p>

    <div id="actions" hidden>
      <button id="complete" type="button">Complete task</button>
      <button id="expand" type="button" class="link" hidden>Show bar on pages</button>
    </div>

    <p class="hint">The bar appears at the top-right of regular web pages and can be dragged anywhere. Chrome's internal pages can't show it, so manage your task here instead.</p>
  </main>
  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
